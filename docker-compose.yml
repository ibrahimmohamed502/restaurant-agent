# Usage: docker compose up -d --build
# The container restarts automatically on crash or host reboot.
#
# Configuration: the ${VARS} below are filled from either —
#   • a local .env file next to this file (docker compose reads it automatically), or
#   • Portainer's stack "Environment variables" box (paste the .env content there).
services:
  restaurant-agent:
    build: .
    container_name: restaurant-page-agent
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: ${PORT:-3000}
      WEBHOOK_VERIFY_TOKEN: ${WEBHOOK_VERIFY_TOKEN}
      FB_APP_ID: ${FB_APP_ID}
      FB_APP_SECRET: ${FB_APP_SECRET}
      FB_GRAPH_VERSION: ${FB_GRAPH_VERSION:-v21.0}
      FB_PAGE_ID: ${FB_PAGE_ID}
      FB_PAGE_ACCESS_TOKEN: ${FB_PAGE_ACCESS_TOKEN}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.8-flash}
      LLM_FALLBACK_MODELS: ${LLM_FALLBACK_MODELS:-}
      MAX_REPLIES_PER_USER_PER_HOUR: ${MAX_REPLIES_PER_USER_PER_HOUR:-30}
      STAFF_ALERT_WEBHOOK_URL: ${STAFF_ALERT_WEBHOOK_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      STAFF_EMAIL_TO: ${STAFF_EMAIL_TO:-}
      STAFF_EMAIL_FROM: ${STAFF_EMAIL_FROM:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      # ---- Stage 1: data layer ----
      DATABASE_URL: ${DATABASE_URL:-postgresql://lwc:${POSTGRES_PASSWORD}@postgres:5432/lwc_saas}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      DATA_DIR: ${DATA_DIR:-/tmp/lwc-data}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Stage 1: Postgres (+ pgvector for future knowledge retrieval)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: restaurant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lwc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lwc_saas}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Stage 1: Redis (queue backbone for Stages 3-4)
  redis:
    image: redis:7-alpine
    container_name: restaurant-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Temporary public tunnel — lets Facebook reach this container
  # until the company domain is ready. Delete this service afterwards.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: restaurant-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://restaurant-agent:3000
    depends_on:
      - restaurant-agent

volumes:
  pg_data:
