# =============================================================================
# LWC Customer Engagement Platform — STAGING ONLY
# Project: restaurant-agent-staging (COMPLETELY SEPARATE FROM PRODUCTION)
# Run: docker compose -p restaurant-agent-staging --env-file .env.staging -f docker-compose.staging.yml up -d --build
# =============================================================================
# Isolation guarantees:
# - Separate Docker Compose project name (no shared networks/volumes)
# - Separate container names (no conflicts with production)
# - Separate host ports bound to 127.0.0.1 only (no public exposure)
# - Separate PostgreSQL database, Redis instance, volumes
# - Separate environment variable file (.env.staging) — NEVER loads production .env
# =============================================================================

name: restaurant-agent-staging

services:
  # ----- Staging API + Facebook bot (internal only) -----
  staging-api:
    build: .
    container_name: staging-page-agent
    restart: unless-stopped
    # Bind to localhost only — no external port exposure
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      WEBHOOK_VERIFY_TOKEN: ${STAGING_WEBHOOK_VERIFY_TOKEN}
      FB_APP_ID: ${STAGING_FB_APP_ID}
      FB_APP_SECRET: ${STAGING_FB_APP_SECRET}
      FB_GRAPH_VERSION: ${FB_GRAPH_VERSION:-v21.0}
      FB_PAGE_ID: ${STAGING_FB_PAGE_ID}
      FB_PAGE_ACCESS_TOKEN: ${STAGING_FB_PAGE_ACCESS_TOKEN}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.8-flash}
      LLM_FALLBACK_MODELS: ${LLM_FALLBACK_MODELS:-}
      MAX_REPLIES_PER_USER_PER_HOUR: ${MAX_REPLIES_PER_USER_PER_HOUR:-30}
      STAFF_ALERT_WEBHOOK_URL: ${STAGING_STAFF_ALERT_WEBHOOK_URL:-}
      RESEND_API_KEY: ${STAGING_RESEND_API_KEY:-}
      STAFF_EMAIL_TO: ${STAGING_STAFF_EMAIL_TO:-}
      STAFF_EMAIL_FROM: ${STAGING_STAFF_EMAIL_FROM:-}
      DASHBOARD_PASSWORD: ${STAGING_DASHBOARD_PASSWORD}
      DATABASE_URL: postgresql://lwc:${STAGING_POSTGRES_PASSWORD}@staging-postgres:5432/staging_lwc_saas
      REDIS_URL: redis://staging-redis:6379
      ENCRYPTION_KEY: ${STAGING_ENCRYPTION_KEY}
      SEED_ADMIN_EMAIL: ${STAGING_SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${STAGING_SEED_ADMIN_PASSWORD}
      DATA_DIR: /tmp/lwc-staging-data
      WEBHOOK_QUEUE_MODE: inline
      KNOWLEDGE_RETRIEVAL_MODE: shadow
      WEB_UPSTREAM: http://staging-web:3000
    depends_on:
      staging-postgres:
        condition: service_healthy
      staging-redis:
        condition: service_healthy

  # ----- Staging PostgreSQL + pgvector (isolated database, isolated volume) -----
  staging-postgres:
    image: pgvector/pgvector:pg16
    container_name: staging-postgres
    restart: unless-stopped
    # NO host port mapping — internal only
    environment:
      POSTGRES_USER: lwc
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD}
      POSTGRES_DB: staging_lwc_saas
    volumes:
      - staging_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ----- Staging Redis (isolated instance) -----
  staging-redis:
    image: redis:7-alpine
    container_name: staging-redis
    restart: unless-stopped
    # NO host port mapping — internal only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ----- Staging Worker (separate container, shared staging DB/Redis) -----
  staging-worker:
    build: .
    container_name: staging-agent-worker
    restart: unless-stopped
    command: ["node", "src/workers/metaEventWorker.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://lwc:${STAGING_POSTGRES_PASSWORD}@staging-postgres:5432/staging_lwc_saas
      REDIS_URL: redis://staging-redis:6379
      ENCRYPTION_KEY: ${STAGING_ENCRYPTION_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.8-flash}
      LLM_FALLBACK_MODELS: ${LLM_FALLBACK_MODELS:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      DATA_DIR: /tmp/lwc-staging-data
    depends_on:
      staging-postgres:
        condition: service_healthy
      staging-redis:
        condition: service_healthy

  # ----- Staging Next.js Web (internal only, proxied by staging-api) -----
  staging-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: staging-web
    hostname: staging-web
    restart: unless-stopped
    # Bind to localhost only — no external port exposure
    ports:
      - "127.0.0.1:3003:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      API_UPSTREAM: http://staging-api:3000
      NEXT_PUBLIC_API_URL: /api/v1
    depends_on:
      staging-api:
        condition: service_started

volumes:
  staging_pg_data:
    # Isolated named volume — NOT shared with production pg_data
    name: restaurant-agent-staging_staging_pg_data

networks:
  default:
    name: restaurant-agent-staging_default
    driver: bridge